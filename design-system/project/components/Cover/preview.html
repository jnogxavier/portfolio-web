<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@350..600&family=Zilla+Slab:wght@500;700&family=Spline+Sans+Mono:wght@400&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--surface); }
  .cover { width: 960px; height: 288px; }
  .declared { fill: var(--brand); }
  .observed { fill: var(--measure); rx: var(--radius-md); }
  .inkblock { fill: var(--ink); rx: var(--radius-md); }
  .healthy  { fill: var(--healthy); rx: var(--radius-sm); }
  .mark     { fill: var(--surface); }
  .name     { fill: var(--ink); font-family: var(--font-display); font-size: 64px; font-weight: 700; letter-spacing: -0.022em; }
  .tagline  { fill: var(--ink-muted); font-family: var(--font-sans); font-size: 13px; font-weight: 500; }
</style>

<!--
  blocos: declared 264x288 (slab cheio), observed 216x104 (radius-md), ink 216x80 (radius-md), healthy 24x24 (radius-sm)
  arranjo: o slab de estrutura sangra topo e base a partir de x=480; os dois blocos escalonados sangram a borda direita e o vao entre eles fecha de space-5 para space-4, o par declarado e observado do sistema de cor posto como composicao
  padrao: grade de cruzetas num passo de espacamento (48px = space-5 + space-2), linha "preciso, tecnico, grade de 4px" — as notas dos tokens medem tudo em grade de 4px e a mono fica reservada a config real, entao a marca de registro le como instrumentacao e nao como enfeite
  escalas: passo 48px, recuos space-4, vaos space-3 / space-4 / space-5, radius-sm na marca healthy, radius-md nos dois blocos escalonados
-->
<svg class="cover" viewBox="0 0 960 288" width="960" height="288" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="jnogxavier — o que construí, o que quebrou, o que faria diferente">
