<!-- @dsCard group="Peças" height=600 subtitle="Como um diagrama se parece aqui" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@350..600&family=Zilla+Slab:wght@500;700&family=Spline+Sans+Mono:wght@400&display=swap">
<style> body { margin: 0; padding: 24px; background: var(--surface); } </style>

<svg id="dg" viewBox="0 0 600 390" width="600" height="390" role="img"
     aria-label="O controlador aplica o estado declarado no repositório sobre duas nuvens e recebe de volta o estado real, em laço contínuo">
  <defs>
    <marker id="jnx-ponta" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" class="jnx-dg-ponta"></path>
    </marker>
  </defs>

  <rect x="200" y="20" width="200" height="52" rx="6" class="jnx-dg-caixa"></rect>
  <text x="216" y="43" class="jnx-dg-rotulo">Repositório</text>
  <text x="216" y="60" class="jnx-dg-nota">manifestos e valores</text>

  <path d="M300 72 L300 110" class="jnx-dg-seta" marker-end="url(#jnx-ponta)"></path>
  <text x="310" y="96" class="jnx-dg-nota">abre PR</text>

  <rect x="200" y="116" width="200" height="52" rx="6" class="jnx-dg-caixa"></rect>
  <text x="216" y="139" class="jnx-dg-rotulo">Esteira</text>
  <text x="216" y="156" class="jnx-dg-nota">build, testes e varredura</text>

  <path d="M300 168 L300 206" class="jnx-dg-seta" marker-end="url(#jnx-ponta)"></path>
  <text x="310" y="192" class="jnx-dg-nota">publica imagem</text>

  <rect x="200" y="212" width="200" height="52" rx="6" class="jnx-dg-caixa jnx-dg-caixa--marcada"></rect>
  <text x="216" y="235" class="jnx-dg-rotulo">Controlador</text>
  <text x="216" y="252" class="jnx-dg-nota">reconcilia 4 ambientes</text>

  <path d="M300 264 L300 286" class="jnx-dg-seta"></path>
  <path d="M145 286 L455 286" class="jnx-dg-seta"></path>
  <path d="M145 286 L145 306" class="jnx-dg-seta" marker-end="url(#jnx-ponta)"></path>
  <path d="M455 286 L455 306" class="jnx-dg-seta" marker-end="url(#jnx-ponta)"></path>
  <text x="300" y="280" class="jnx-dg-nota" text-anchor="middle">aplica o estado declarado</text>

  <rect x="30" y="312" width="230" height="58" rx="6" class="jnx-dg-caixa"></rect>
  <text x="46" y="335" class="jnx-dg-rotulo">Nuvem A</text>
  <text x="46" y="352" class="jnx-dg-nota">20 serviços, Kubernetes gerenciado</text>

  <rect x="340" y="312" width="230" height="58" rx="6" class="jnx-dg-caixa"></rect>
  <text x="356" y="335" class="jnx-dg-rotulo">Nuvem B</text>
  <text x="356" y="352" class="jnx-dg-nota">contêineres gerenciados</text>

  <path d="M570 341 L586 341 L586 238 L404 238" class="jnx-dg-seta" marker-end="url(#jnx-ponta)"></path>
  <text x="494" y="231" class="jnx-dg-nota" text-anchor="middle">reporta o estado real</text>
</svg>

<div id="root"></div>
<script>
  var svg = document.getElementById('dg');
  svg.remove();
  document.getElementById('root').appendChild(window.Jnx.Diagrama({
    conteudo: svg,
    legenda: 'Plataforma da BCJ, anonimizada. O laço é o ponto: o controlador aplica o que está declarado no repositório e lê de volta o que de fato está rodando, sem ninguém dar deploy à mão. Nome de provedor e de produto saíram porque não mudam o que o desenho explica.'
  }));
</script>
